<!DOCTYPE html>
<html>

<head>
    <title>MathQuill Undo Test Page</title>
</head>

<body>
    <p>Editable math field: <span id="math-field">x^2</span></p>
    <p>LaTeX of what you typed: <code id="latex">x^2</code></p>

    <script type="module">
        import MathQuill from 'mathquill'
        import 'mathquill/mathquill.css'

        const mathFieldSpan = document.getElementById('math-field')
        const latexSpan = document.getElementById('latex')

        let isRestoring = false

        const mathField = MathQuill.MathField(mathFieldSpan, {
            handlers: {
                edit: function () {
                    if (isRestoring) return

                    const currentLatex = mathField.latex()
                    latexSpan.textContent = currentLatex

                    if (historyIndex < history.length - 1) {
                        history.splice(historyIndex + 1)
                    }

                    history.push(currentLatex)

                    // Ограничиваем размер истории
                    if (history.length > MAX_HISTORY) {
                        history.shift()
                    }

                    historyIndex = history.length - 1
                },
            },
        })

        const history = ['']
        let historyIndex = 0
        const MAX_HISTORY = 100

        function applyHistoryState(index) {
            if (index >= 0 && index < history.length) {
                isRestoring = true
                historyIndex = index
                const latex = history[historyIndex]
                mathField.latex(latex)
                latexSpan.textContent = latex
                isRestoring = false
            }
        }

        document.addEventListener('keydown', (e) => {
            // Ctrl+Z - Undo
            if (e.code === 'KeyZ' && e.ctrlKey) {
                e.preventDefault()
                if (historyIndex > 0) {
                    applyHistoryState(historyIndex - 1)
                }
            }

            // Ctrl+Y
            if (e.code === 'KeyY' && e.ctrlKey) {
                e.preventDefault()
                if (historyIndex < history.length - 1) {
                    applyHistoryState(historyIndex + 1)
                }
            }
        })
    </script>
</body>

</html>
